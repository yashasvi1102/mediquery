<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediQuery — Clinical Intelligence</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.9/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; background: #f1f5f9; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
        @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
        .fade-up { animation: fadeUp 0.4s ease forwards; }
        .d1 { animation-delay:.1s; opacity:0; } .d2 { animation-delay:.2s; opacity:0; } .d3 { animation-delay:.3s; opacity:0; }
        .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 400px 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const API = "http://localhost:8080";

/* ─── Icons ─── */
const I={
    Pulse:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
    Users:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
    Shield:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
    Alert:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
    Chat:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>,
    Bar:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>,
    Down:p=><svg xmlns="http://www.w3.org/2000/svg" width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>,
    Out:p=><svg xmlns="http://www.w3.org/2000/svg" width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
    Send:p=><svg xmlns="http://www.w3.org/2000/svg" width={18} height={18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
    Spin:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
    Steth:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>,
    Flask:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/></svg>,
    Gear:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
    Person:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
    Arrow:p=><svg xmlns="http://www.w3.org/2000/svg" width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>,
    Check:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||18} height={p.s||18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
    Heart:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>,
    Pill:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>,
    Calendar:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
    File:p=><svg xmlns="http://www.w3.org/2000/svg" width={p.s||20} height={p.s||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>,
};

const ROLES=[
    {key:"dr_smith",label:"Doctor",desc:"Full access to patient data",icon:I.Steth,bg:"bg-blue-500",light:"bg-blue-50 text-blue-600"},
    {key:"researcher1",label:"Researcher",desc:"De-identified, hashed IDs",icon:I.Flask,bg:"bg-purple-500",light:"bg-purple-50 text-purple-600"},
    {key:"admin1",label:"Admin",desc:"Operational metrics only",icon:I.Gear,bg:"bg-amber-500",light:"bg-amber-50 text-amber-600"},
    {key:"patient_demo",label:"Patient",desc:"Own health record",icon:I.Person,bg:"bg-emerald-500",light:"bg-emerald-50 text-emerald-600"},
];

const QS={
    doctor:[{q:"How many patients have diabetes?",cat:"Count",c:"blue"},{q:"List 5 patients with heart failure",cat:"Lookup",c:"rose"},{q:"Show patients prescribed warfarin and aspirin",cat:"Drug Safety",c:"amber"},{q:"What is the most common condition?",cat:"Analytics",c:"emerald"},{q:"How many inpatient encounters?",cat:"Utilization",c:"violet"},{q:"Which provider has the most patients?",cat:"Provider",c:"cyan"}],
    researcher:[{q:"How many patients have hypertension?",cat:"Count",c:"blue"},{q:"Gender breakdown of diabetic patients",cat:"Demographics",c:"emerald"},{q:"Medications for COPD patients",cat:"Medications",c:"violet"},{q:"30-day readmission rate?",cat:"Readmission",c:"rose"}],
    admin:[{q:"How many encounters in the database?",cat:"Volume",c:"blue"},{q:"How many providers are there?",cat:"Providers",c:"emerald"},{q:"Most common encounter type?",cat:"Analytics",c:"violet"}],
    patient:[{q:"What conditions do I have?",cat:"Conditions",c:"blue"},{q:"What medications am I on?",cat:"Medications",c:"emerald"},{q:"Show my encounter history",cat:"Encounters",c:"violet"}],
};

/* ─── API ─── */
async function api(path,opts={}){
    const tk=localStorage.getItem("mq_token");
    const h={"Content-Type":"application/json"};
    if(tk) h["Authorization"]=`Bearer ${tk}`;
    try{const r=await fetch(`${API}${path}`,{...opts,headers:h});if(r.status===401||r.status===403)return{error:`Access denied (${r.status})`};return await r.json();}
    catch(e){return{error:"API offline. Start uvicorn on port 8080."};}
}

/* ─── Skeleton ─── */
function Skeleton({h=20,w="100%",r=8}){return <div className="skeleton" style={{height:h,width:w,borderRadius:r}}/>;}

/* ─── Navbar ─── */
function Nav({user,onLogout}){
    const[open,setOpen]=useState(false);
    return(<nav className="bg-gradient-to-r from-slate-900 to-slate-800 sticky top-0 z-50 shadow-lg">
        <div className="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
            <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center text-white"><I.Pulse s={16}/></div>
                <div className="leading-tight"><div className="text-white font-extrabold text-[15px] tracking-tight">MediQuery</div><div className="text-slate-500 text-[9px] tracking-[2px] uppercase">Clinical Intelligence</div></div>
            </div>
            {user&&<div className="relative">
                <button onClick={()=>setOpen(!open)} className="flex items-center gap-2 bg-white/10 hover:bg-white/15 pl-3 pr-2 py-1.5 rounded-full transition text-sm">
                    <span className="text-slate-300 font-medium">{user.username}</span>
                    <span className="bg-blue-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">{user.role.toUpperCase()}</span>
                    <I.Down/>
                </button>
                {open&&<div className="absolute right-0 mt-2 w-44 bg-white rounded-xl shadow-xl border border-slate-100 py-1 z-50">
                    <button onClick={()=>{onLogout();setOpen(false);}} className="w-full text-left px-4 py-2.5 text-sm text-slate-600 hover:bg-slate-50 flex items-center gap-2"><I.Out/> Sign out</button>
                </div>}
            </div>}
        </div>
    </nav>);
}

/* ─── Landing ─── */
function Landing({onLogin}){
    const[sel,setSel]=useState(0);const[busy,setBusy]=useState(false);const[ok,setOk]=useState(null);
    useEffect(()=>{api("/health").then(d=>setOk(d?.status==="healthy"));},[]);
    const go=async()=>{setBusy(true);const d=await api("/auth/token",{method:"POST",body:JSON.stringify({username:ROLES[sel].key})});setBusy(false);if(d?.access_token){localStorage.setItem("mq_token",d.access_token);onLogin({username:d.username,role:d.role});}};
    return(<div className="min-h-screen bg-gradient-to-b from-slate-50 to-white"><Nav/>
        <div className="max-w-6xl mx-auto px-6 pt-14 pb-6 text-center fade-up">
            <div className="inline-flex items-center gap-2 bg-blue-50 text-blue-600 text-xs font-semibold px-3 py-1 rounded-full mb-5"><I.Pulse s={14}/> Healthcare Data Intelligence</div>
            <h1 className="text-5xl font-black tracking-tight text-slate-900 mb-3 leading-tight">Clinical Data,<br/><span className="bg-gradient-to-r from-blue-600 to-cyan-500 bg-clip-text text-transparent">Understood</span></h1>
            <p className="text-lg text-slate-500 max-w-lg mx-auto leading-relaxed mb-2">Ask questions in plain English. Get cited, confidence-scored answers from a knowledge graph.</p>
            <p className="text-xs text-slate-400">Powered by Neo4j · Ollama · FHIR/SNOMED · 4-Tier RBAC</p>
        </div>
        {/* How it works */}
        <div className="max-w-4xl mx-auto px-6 mb-10 fade-up d1">
            <h3 className="text-center text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-6">How it works</h3>
            <div className="grid grid-cols-3 gap-5">
                {[{n:"1",cl:"bg-blue-500",t:"Ask a Question",d:"Type a clinical question. The router classifies it as structured, semantic, or hybrid."},
                  {n:"2",cl:"bg-violet-500",t:"AI Generates Query",d:"The LLM converts your question into a Neo4j Cypher query using schema injection and few-shot examples."},
                  {n:"3",cl:"bg-emerald-500",t:"Cited Answer",d:"Results verified, citations validated, confidence scored 0-100. Below 40 = refusal. No hallucinations."}
                ].map(s=><div key={s.n} className="relative bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">
                    <div className={`absolute -top-3 -left-3 w-7 h-7 rounded-full ${s.cl} text-white text-xs font-bold flex items-center justify-center shadow-lg`}>{s.n}</div>
                    <h4 className="font-bold text-slate-800 mb-1 text-sm mt-1">{s.t}</h4><p className="text-xs text-slate-400 leading-relaxed">{s.d}</p>
                </div>)}
            </div>
        </div>
        {/* Stats */}
        <div className="flex justify-center gap-3 mb-10 fade-up d2 flex-wrap">
            {[{v:"11,446",l:"Patients",c:"blue"},{v:"682K",l:"Graph Nodes",c:"violet"},{v:"2.5M",l:"Relationships",c:"emerald"},{v:"100%",l:"Anomaly Recall",c:"rose"},{v:"0",l:"Hallucinated IDs",c:"amber"}].map(s=>
                <div key={s.l} className="bg-white rounded-xl px-4 py-2.5 shadow-sm border border-slate-100 text-center min-w-[100px]">
                    <div className={`text-lg font-extrabold text-${s.c}-600`}>{s.v}</div><div className="text-[10px] text-slate-400">{s.l}</div>
                </div>
            )}
        </div>
        {/* Login */}
        <div className="max-w-md mx-auto px-6 pb-16 fade-up d3">
            <div className="bg-white rounded-2xl shadow-lg border border-slate-100 p-7">
                <h3 className="font-bold text-slate-800 mb-1">Get started</h3><p className="text-sm text-slate-400 mb-4">Each role sees different data. RBAC enforced at the API layer.</p>
                <div className="space-y-2 mb-4">
                    {ROLES.map((r,i)=><button key={r.key} onClick={()=>setSel(i)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl border transition ${sel===i?'border-blue-500 bg-blue-50 ring-2 ring-blue-100':'border-slate-100 hover:border-slate-200'}`}>
                        <div className={`w-9 h-9 rounded-lg flex items-center justify-center transition ${sel===i?r.bg+' text-white shadow-md':'bg-slate-100 text-slate-400'}`}><r.icon/></div>
                        <div className="text-left flex-1"><div className="text-sm font-semibold text-slate-700">{r.label}</div><div className="text-xs text-slate-400">{r.desc}</div></div>
                        {sel===i&&<I.Check className="text-blue-500"/>}
                    </button>)}
                </div>
                <button onClick={go} disabled={busy} className="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-500/20 disabled:opacity-50 flex items-center justify-center gap-2">
                    {busy?<I.Spin/>:<><span>Launch MediQuery</span><I.Arrow/></>}
                </button>
                <div className="text-center mt-3">
                    {ok===true&&<span className="text-xs text-emerald-500 font-medium">● API connected</span>}
                    {ok===false&&<span className="text-xs text-red-500 font-medium">● API offline</span>}
                </div>
            </div>
        </div>
    </div>);
}
function QuickStats(){
    const[data,setData]=useState(null);
    useEffect(()=>{api("/stats").then(d=>setData(d));},[]);
    if(!data?.counts) return null;
    const c=data.counts;
    return(<div className="grid grid-cols-5 gap-3 mb-6 fade-up d1">
        {[{v:c.patients,l:"Patients",c:"blue"},{v:c.encounters,l:"Encounters",c:"emerald"},{v:c.providers,l:"Providers",c:"violet"},{v:c.conditions,l:"Conditions",c:"cyan"},{v:c.medications,l:"Medications",c:"amber"}].map(s=>
            <div key={s.l} className="bg-white rounded-xl p-4 border border-slate-100 shadow-sm text-center">
                <div className={`text-xl font-extrabold text-${s.c}-600`}>{s.v.toLocaleString()}</div>
                <div className="text-[10px] text-slate-400 mt-0.5">{s.l}</div>
            </div>
        )}
    </div>);
}
/* ─── Dashboard Home ─── */
function Home({role,nav}){
    const qs=QS[role]||QS.doctor;
    const greet={doctor:"Welcome, Doctor",researcher:"Research Portal",admin:"Operations",patient:"Your Health"}[role];
    return(<div className="max-w-5xl mx-auto px-6 py-7">
        <h2 className="text-2xl font-bold text-slate-800 mb-1 fade-up">{greet}</h2>
        <p className="text-sm text-slate-400 mb-6 fade-up">Select a tool or click a recommended question to get started.</p>
        {role!=="admin"&&role!=="patient"&&<div className="grid grid-cols-3 gap-4 mb-8 fade-up d1">
            {[{l:"Clinical Query",d:"Ask questions in natural language",i:I.Chat,c:"blue",t:"chat"},
              {l:"Cohort Builder",d:"Define patient populations",i:I.Users,c:"emerald",t:"cohort"},
              {l:"Anomaly Detection",d:"Drug safety & readmission alerts",i:I.Alert,c:"rose",t:"anomaly"}
            ].map(a=><button key={a.t} onClick={()=>nav(a.t)} className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition text-left group">
                <div className={`w-10 h-10 rounded-xl bg-${a.c}-50 text-${a.c}-500 flex items-center justify-center mb-3`}><a.i/></div>
                <h4 className="font-bold text-slate-700 text-sm mb-0.5">{a.l}</h4><p className="text-xs text-slate-400">{a.d}</p>
            </button>)}
        </div>}
         <QuickStats />
        <h3 className="text-sm font-semibold text-slate-500 mb-3 fade-up d2">Recommended questions</h3>
        <div className="grid grid-cols-2 gap-3 fade-up d2">
            {qs.map((q,i)=><button key={i} onClick={()=>nav("chat",q.q)} className="bg-white rounded-xl px-5 py-4 border border-slate-100 shadow-sm hover:shadow-md hover:border-blue-200 transition text-left group">
                <span className={`text-[10px] font-bold uppercase tracking-wider text-${q.c}-500`}>{q.cat}</span>
                <p className="text-sm text-slate-700 font-medium mt-1 leading-snug">{q.q}</p>
            </button>)}
        </div>
    </div>);
}

/* ─── Chat ─── */
function ChatView({role,initQ}){
    const[msgs,setMsgs]=useState([]);const[inp,setInp]=useState("");const[busy,setBusy]=useState(false);const ref=useRef(null);
    const send=useCallback(async(q)=>{
        const question=q||inp;if(!question.trim()||busy)return;setInp("");
        setMsgs(p=>[...p,{r:"user",t:question}]);setBusy(true);
        const d=await api("/query",{method:"POST",body:JSON.stringify({question})});setBusy(false);
        setMsgs(p=>[...p,{r:"ai",t:d.answer||d.error||"No response.",m:{route:d.route,conf:d.confidence_score,results:d.result_count,cypher:d.cypher}}]);
    },[inp,busy]);
    useEffect(()=>{ref.current?.scrollIntoView({behavior:"smooth"});},[msgs]);
    useEffect(()=>{if(initQ)send(initQ);},[]);
    const qs=QS[role]||[];
    return(<div className="flex flex-col h-[calc(100vh-7rem)]">
        <div className="flex-1 overflow-y-auto px-6 py-6 hide-scroll">
            {msgs.length===0&&!busy&&<div className="max-w-2xl mx-auto text-center pt-10">
                <div className="w-14 h-14 rounded-2xl bg-blue-50 text-blue-500 flex items-center justify-center mx-auto mb-4"><I.Chat s={28}/></div>
                <h3 className="text-lg font-bold text-slate-700 mb-1">Ask a clinical question</h3>
                <p className="text-sm text-slate-400 mb-6">Routed to Neo4j (structured), Chroma (semantic), or both (hybrid)</p>
                <div className="grid grid-cols-2 gap-2 max-w-lg mx-auto">
                    {qs.slice(0,4).map((q,i)=><button key={i} onClick={()=>send(q.q)} className="px-4 py-2.5 bg-white rounded-xl border border-slate-100 text-sm text-slate-600 hover:border-blue-300 hover:text-blue-600 transition text-left shadow-sm">{q.q}</button>)}
                </div>
            </div>}
            <div className="max-w-3xl mx-auto space-y-4">
                {msgs.map((m,i)=><div key={i} className={`flex ${m.r==='user'?'justify-end':'justify-start'}`}>
                    <div className={`max-w-xl rounded-2xl px-5 py-3 ${m.r==='user'?'bg-blue-600 text-white shadow-lg shadow-blue-500/15':'bg-white border border-slate-100 shadow-sm'}`}>
                        <p className={`text-sm leading-relaxed whitespace-pre-wrap ${m.r==='user'?'':'text-slate-700'}`}>{m.t}</p>
                        {m.m&&<div className="mt-2 flex items-center gap-2 flex-wrap">
                            <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full ${m.m.conf>=70?'bg-emerald-100 text-emerald-700':m.m.conf>=40?'bg-amber-100 text-amber-700':'bg-red-100 text-red-700'}`}>{m.m.conf}/100</span>
                            <span className="text-[11px] text-slate-400">{m.m.route} · {m.m.results} results</span>
                            {m.m.cypher&&<details className="w-full mt-1"><summary className="text-[11px] text-slate-400 cursor-pointer hover:text-blue-500">View Cypher</summary><pre className="mt-1 text-[10px] bg-slate-50 p-2 rounded-lg overflow-x-auto text-slate-600">{m.m.cypher}</pre></details>}
                        </div>}
                    </div>
                </div>)}
                {busy&&<div className="flex justify-start"><div className="bg-white border border-slate-100 rounded-2xl px-5 py-3 shadow-sm flex items-center gap-3 text-slate-400 text-sm"><I.Spin/><div><div className="font-medium text-slate-500">Analyzing clinical data...</div><div className="text-xs text-slate-400 mt-0.5">Generating Cypher query and synthesizing answer</div></div></div></div>}
            </div>
            <div ref={ref}/>
        </div>
        <div className="border-t border-slate-200 bg-white px-6 py-3">
            <div className="max-w-3xl mx-auto flex gap-2">
                <input value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Ask about patients, conditions, medications..." className="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 focus:border-blue-400 focus:ring-2 focus:ring-blue-50 outline-none text-sm bg-slate-50"/>
                <button onClick={()=>send()} disabled={busy||!inp.trim()} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl transition disabled:opacity-30"><I.Send/></button>
            </div>
        </div>
    </div>);
}

/* ─── Cohort ─── */
function CohortView(){
    const[def,setDef]=useState("");const[res,setRes]=useState(null);const[busy,setBusy]=useState(false);
    const build=async()=>{setBusy(true);setRes(null);const d=await api("/cohort",{method:"POST",body:JSON.stringify({definition:def})});setRes(d);setBusy(false);};
    return(<div className="max-w-5xl mx-auto px-6 py-7">
        <h2 className="text-xl font-bold text-slate-800 mb-1">Cohort Builder</h2><p className="text-sm text-slate-400 mb-5">Define a patient population in natural language.</p>
        <div className="flex gap-2 mb-6">
            <input value={def} onChange={e=>setDef(e.target.value)} onKeyDown={e=>e.key==='Enter'&&build()} placeholder="e.g., Diabetic patients over 65" className="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 focus:border-emerald-400 focus:ring-2 focus:ring-emerald-50 outline-none text-sm bg-white"/>
            <button onClick={build} disabled={busy||!def.trim()} className="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-5 py-2.5 rounded-xl transition disabled:opacity-40 flex items-center gap-2">{busy?<I.Spin/>:<I.Users/>} Build</button>
        </div>
        {busy&&<div className="space-y-3"><Skeleton h={80}/><div className="grid grid-cols-2 gap-3"><Skeleton h={150}/><Skeleton h={150}/></div></div>}
        {res?.error&&<div className="bg-red-50 text-red-600 px-4 py-3 rounded-xl text-sm">{res.error}</div>}
        {res?.patient_count>0&&<>
            <div className="bg-gradient-to-r from-emerald-500 to-teal-400 rounded-2xl p-6 text-center text-white mb-6 shadow-lg shadow-emerald-500/20"><div className="text-5xl font-black">{res.patient_count.toLocaleString()}</div><div className="text-sm opacity-90 mt-1">Patients Found</div></div>
            <div className="grid grid-cols-2 gap-4 mb-4">
                <div className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm"><h4 className="font-bold text-slate-700 mb-3 text-sm">Gender</h4>{(res.demographics?.gender||[]).map(g=><div key={g.gender} className="flex justify-between text-sm py-1 border-b border-slate-50"><span className="text-slate-500 capitalize">{g.gender}</span><span className="font-semibold">{g.count}</span></div>)}</div>
                <div className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm"><h4 className="font-bold text-slate-700 mb-3 text-sm">Top Conditions</h4>{(res.top_conditions||[]).slice(0,6).map((c,i)=><div key={i} className="flex justify-between text-sm py-1 border-b border-slate-50"><span className="text-slate-500 truncate mr-2">{c.chronic_condition||c.condition||'—'}</span><span className="font-semibold">{c.patient_count}</span></div>)}</div>
            </div>
            <div className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm mb-4"><h4 className="font-bold text-slate-700 mb-3 text-sm">Top Medications</h4>
                {(res.top_medications||[]).slice(0,6).map((m,i)=><div key={i} className="flex justify-between text-sm py-1 border-b border-slate-50"><span className="text-slate-500 truncate mr-2">{(m.medication||'').substring(0,40)} <span className="text-slate-300">({m.drug_class})</span></span><span className="font-semibold">{m.patient_count}</span></div>)}
            </div>
        </>}
    </div>);
}

/* ─── Anomaly ─── */
function AnomalyView(){
    const[data,setData]=useState(null);const[busy,setBusy]=useState(false);
    const run=async()=>{setBusy(true);setData(null);const d=await api("/anomalies/detect");setData(d);setBusy(false);};
    return(<div className="max-w-4xl mx-auto px-6 py-7">
        <h2 className="text-xl font-bold text-slate-800 mb-1">Anomaly Detection</h2><p className="text-sm text-slate-400 mb-5">Drug interaction and readmission safety alerts.</p>
        <button onClick={run} disabled={busy} className="bg-rose-500 hover:bg-rose-600 text-white font-semibold px-5 py-2.5 rounded-xl transition disabled:opacity-50 flex items-center gap-2 mb-6">{busy?<I.Spin/>:<I.Alert/>} Run Detection</button>
        {busy&&<div className="space-y-3"><Skeleton h={100}/><Skeleton h={100}/></div>}
        {data?.error&&<div className="bg-red-50 text-red-600 px-4 py-3 rounded-xl text-sm">{data.error}</div>}
        {data?.anomalies&&Object.entries(data.anomalies).map(([k,v])=><div key={k} className="bg-white rounded-2xl border-l-4 border-rose-500 shadow-sm p-6 mb-4 fade-up">
            <div className="flex items-center justify-between"><div><h3 className="font-bold text-slate-800">{k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}</h3><p className="text-sm text-slate-400">{v.description}</p></div>
            <div className="text-right"><div className="text-3xl font-black text-slate-900">{v.patient_count}</div><div className="text-[10px] text-slate-400 uppercase">Flagged</div></div></div>
        </div>)}
    </div>);
}

/* ─── Admin ─── */
function AdminView(){
    const[data,setData]=useState(null);const[busy,setBusy]=useState(true);
    useEffect(()=>{api("/stats").then(d=>{setData(d);setBusy(false);});},[]);

    const cards=[
        {k:"patients",i:I.Users,c:"blue",l:"Patients"},
        {k:"encounters",i:I.Pulse,c:"emerald",l:"Encounters"},
        {k:"providers",i:I.Steth,c:"violet",l:"Providers"},
        {k:"inpatient",i:I.Bar,c:"amber",l:"Inpatient"},
    ];

    return(<div className="max-w-5xl mx-auto px-6 py-7">
        <h2 className="text-xl font-bold text-slate-800 mb-1">Operations</h2>
        <p className="text-sm text-slate-400 mb-6">Real-time database statistics. No LLM involved — instant results.</p>

        <div className="grid grid-cols-4 gap-4 mb-6">
            {cards.map(q=><div key={q.k} className={`bg-white rounded-2xl p-5 border-t-4 border-${q.c}-500 shadow-sm text-center`}>
                <div className={`w-10 h-10 rounded-xl bg-${q.c}-50 text-${q.c}-500 flex items-center justify-center mx-auto mb-3`}><q.i/></div>
                {busy?<Skeleton h={32} w="60%"/>:<div className="text-2xl font-black text-slate-800">{(data?.counts?.[q.k]||0).toLocaleString()}</div>}
                <div className="text-[11px] text-slate-400 uppercase mt-1">{q.l}</div>
            </div>)}
        </div>

        {data && <div className="grid grid-cols-2 gap-4">
            <div className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">
                <h4 className="font-bold text-slate-700 mb-3 text-sm">Chronic Conditions</h4>
                {(data.chronic_conditions||[]).map(c=><div key={c.condition} className="flex justify-between text-sm py-2 border-b border-slate-50">
                    <span className="text-slate-600 font-medium">{c.condition.replace(/_/g,' ').replace(/\b\w/g,x=>x.toUpperCase())}</span>
                    <span className="font-bold text-slate-800">{c.patients.toLocaleString()}</span>
                </div>)}
            </div>
            <div className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">
                <h4 className="font-bold text-slate-700 mb-3 text-sm">Encounter Types</h4>
                {(data.encounter_types||[]).map(e=><div key={e.type} className="flex justify-between text-sm py-2 border-b border-slate-50">
                    <span className="text-slate-600 font-medium">{e.type}</span>
                    <span className="font-bold text-slate-800">{e.count.toLocaleString()}</span>
                </div>)}
            </div>
        </div>}
    </div>);
}

/* ─── Patient ─── */
function PatientView(){
    const[data,setData]=useState(null);const[busy,setBusy]=useState(true);const[tab,setTab]=useState(0);
    
    useEffect(()=>{
        api("/patient/summary").then(d=>{setData(d);setBusy(false);});
    },[]);

    const tabs=[
        {k:"conditions",label:"Conditions",icon:I.Heart,c:"rose"},
        {k:"medications",label:"Medications",icon:I.Pill,c:"violet"},
        {k:"encounters",label:"Encounters",icon:I.Calendar,c:"blue"},
    ];

    return(<div className="max-w-4xl mx-auto px-6 py-7">
        {/* Patient header */}
        {data?.patient?.first_name && <div className="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm mb-6 flex items-center gap-4">
            <div className="w-14 h-14 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center"><I.Person s={28}/></div>
            <div className="flex-1">
                <h2 className="text-xl font-bold text-slate-800">{data.patient.first_name} {data.patient.last_name}</h2>
                <p className="text-sm text-slate-400">{data.patient.age} years old · {data.patient.gender} · {data.patient.city}, {data.patient.state}</p>
            </div>
            <div className="flex gap-3">
                <div className="text-center"><div className="text-2xl font-black text-blue-600">{data.counts?.conditions||0}</div><div className="text-[10px] text-slate-400 uppercase">Conditions</div></div>
                <div className="text-center"><div className="text-2xl font-black text-violet-600">{data.counts?.medications||0}</div><div className="text-[10px] text-slate-400 uppercase">Medications</div></div>
                <div className="text-center"><div className="text-2xl font-black text-emerald-600">{data.counts?.encounters||0}</div><div className="text-[10px] text-slate-400 uppercase">Encounters</div></div>
            </div>
        </div>}

        {/* Tabs */}
        <div className="flex gap-2 mb-5">
            {tabs.map((t,i)=><button key={t.k} onClick={()=>setTab(i)} className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium transition ${tab===i?`bg-${t.c}-500 text-white shadow-md`:'bg-white text-slate-500 hover:bg-slate-50 border border-slate-200'}`}><t.icon s={16}/> {t.label}</button>)}
        </div>

        {/* Content */}
        <div className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
            {busy ? <div className="p-6 space-y-3"><Skeleton h={20} w="80%"/><Skeleton h={20} w="60%"/><Skeleton h={20} w="70%"/></div> :
            data?.error ? <div className="p-6 text-red-500 text-sm">{data.error}</div> :

            /* Conditions */
            tab===0 ? <div className="divide-y divide-slate-50">
                {(data?.conditions||[]).length===0 ? <div className="p-8 text-center text-slate-400">No conditions on file.</div> :
                (data?.conditions||[]).map((c,i)=><div key={i} className="px-5 py-3 flex items-center justify-between hover:bg-slate-50 transition">
                    <div><div className="text-sm font-medium text-slate-700">{c.condition}</div><div className="text-xs text-slate-400">{c.category}</div></div>
                    {c.flag && <span className="text-[10px] font-bold bg-red-50 text-red-600 px-2 py-0.5 rounded-full uppercase">{c.flag}</span>}
                </div>)}
            </div> :

            /* Medications */
            tab===1 ? <div className="divide-y divide-slate-50">
                {(data?.medications||[]).length===0 ? <div className="p-8 text-center text-slate-400">No medications on file.</div> :
                (data?.medications||[]).map((m,i)=><div key={i} className="px-5 py-3 flex items-center justify-between hover:bg-slate-50 transition">
                    <div><div className="text-sm font-medium text-slate-700">{(m.medication||'').substring(0,60)}</div><div className="text-xs text-slate-400">{m.drug_class||'other'}</div></div>
                    {m.flag && <span className="text-[10px] font-bold bg-violet-50 text-violet-600 px-2 py-0.5 rounded-full uppercase">{m.flag}</span>}
                </div>)}
            </div> :

            /* Encounters */
            <div className="divide-y divide-slate-50">
                {(data?.encounters||[]).length===0 ? <div className="p-8 text-center text-slate-400">No encounters on file.</div> :
                (data?.encounters||[]).map((e,i)=><div key={i} className="px-5 py-3 flex items-center justify-between hover:bg-slate-50 transition">
                    <div><div className="text-sm font-medium text-slate-700">{e.reason||e.type}</div><div className="text-xs text-slate-400">{e.type} · {e.duration ? Math.round(e.duration)+' min' : ''}</div></div>
                    <span className="text-xs text-slate-400">{e.date ? new Date(e.date).toLocaleDateString() : ''}</span>
                </div>)}
            </div>}
        </div>
    </div>);
}
/* ─── App ─── */
function App(){
    const[user,setUser]=useState(null);const[tab,setTab]=useState("home");const[initQ,setInitQ]=useState(null);
    const logout=()=>{localStorage.removeItem("mq_token");setUser(null);setTab("home");};
    const nav=(t,q)=>{setInitQ(q||null);setTab(t);};
    if(!user) return <Landing onLogin={u=>{setUser(u);setTab("home");}}/>;

    const navTabs=(user.role==="admin"||user.role==="patient")?[]:
        [{k:"home",l:"Dashboard",i:I.Bar},{k:"chat",l:"Clinical Query",i:I.Chat},{k:"cohort",l:"Cohort Builder",i:I.Users},{k:"anomaly",l:"Anomalies",i:I.Alert}];

    return(<div className="min-h-screen bg-slate-50">
        <Nav user={user} onLogout={logout}/>
        {navTabs.length>0&&<div className="bg-white border-b border-slate-100 shadow-sm"><div className="max-w-7xl mx-auto px-6 flex">
            {navTabs.map(t=><button key={t.k} onClick={()=>{setInitQ(null);setTab(t.k);}} className={`flex items-center gap-2 px-4 py-3 text-sm font-medium border-b-2 transition ${tab===t.k?'border-blue-500 text-blue-600':'border-transparent text-slate-400 hover:text-slate-600'}`}><t.i s={16}/> {t.l}</button>)}
        </div></div>}
        {user.role==="admin"?<AdminView/>:
         user.role==="patient"?<PatientView/>:
         tab==="home"?<Home role={user.role} nav={nav}/>:
         tab==="chat"?<ChatView role={user.role} initQ={initQ}/>:
         tab==="cohort"?<CohortView/>:
         <AnomalyView/>}
    </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
