version: 2

models:
  - name: gold_readmissions
    description: |
      Hospital readmission pairs. One row per (index encounter, next inpatient
      encounter) pair for the same patient. is_30_day_readmission flags pairs
      where the second encounter starts within 30 days of the first's discharge.

      Definition follows CMS Hospital-Wide Readmission (HWR): all-cause
      unplanned 30-day readmissions. Overlapping encounters (days_between < 0)
      and pairs > 365 days apart are excluded. Same-day readmissions are
      included and flagged; downstream models can filter via is_same_day = false.

      Reason codes are classified using the DD-001 SNOMED-suffix pattern so
      history and situation codes (which Synthea uses for follow-up visits)
      can be filtered out via readmission_reason_is_clinical.

      Grain: one row per readmission pair (patient, index_encounter, next_encounter).
      A patient with 3 inpatient encounters produces up to 2 rows in this table.

    columns:
      - name: patient_id
        description: FHIR Patient resource id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_patients')
                field: patient_id

      - name: index_encounter_id
        description: The prior inpatient encounter in the pair.
        tests:
          - not_null

      - name: index_discharge
        description: end_time of the index encounter. Used as the anchor for the 30-day window.
        tests:
          - not_null

      - name: index_reason_code
        description: SNOMED code of the primary reason for the index admission.

      - name: index_reason_display
        description: Human-readable reason for the index admission.

      - name: index_length_of_stay_days
        description: Length of stay of the index encounter, in days.

      - name: readmission_encounter_id
        description: The subsequent inpatient encounter in the pair.
        tests:
          - not_null
          - unique

      - name: readmission_start
        description: start_time of the subsequent inpatient encounter.
        tests:
          - not_null

      - name: readmission_reason_code
        description: SNOMED code of the primary reason for the readmission.

      - name: readmission_reason_display
        description: Human-readable reason for the readmission.

      - name: readmission_provider_id
        description: Provider associated with the readmission encounter.

      - name: days_between
        description: Days between index_discharge and readmission_start. Never negative, capped at 365.
        tests:
          - not_null

      - name: is_same_day
        description: True if the readmission starts on the same calendar day as the index discharge.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: is_30_day_readmission
        description: True if days_between <= 30. Core CMS-aligned readmission flag.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: is_same_reason
        description: |
          True if the index and readmission share the same SNOMED reason_code.
          Useful for distinguishing complication-driven readmissions from unrelated ones.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: readmission_reason_category
        description: |
          Classification of readmission reason SNOMED code by suffix.
          Same pattern as silver_conditions DD-001. Values: disorder, finding,
          situation, procedure, therapy, history, other.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [disorder, finding, situation, procedure, therapy, history, other]

      - name: readmission_reason_is_clinical
        description: |
          True only for disorder and finding codes. Filters out history and
          situation codes that Synthea uses for follow-up visits (e.g., cancer
          TNM staging, "history of CABG").
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: is_likely_planned
        description: |
          Heuristic flag for planned readmissions (oncology staging, chemotherapy,
          therapy regimens). Excluded from unplanned readmission analysis.
          Real CMS methodology (Planned Readmission Algorithm v4.0) uses a much
          larger code list; this is a Synthea-specific approximation targeting
          the TNM staging admissions that dominate the raw counts.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: gold_chronic_conditions
    description: |
      Chronic conditions cohort. One row per (patient_id, condition_flag) pair
      for patients diagnosed with one of the four tracked chronic conditions:
      diabetes_t2, hypertension, heart_failure, copd.

      Enforces DD-001: only rows with condition_flag IS NOT NULL are included.
      Patients with multiple chronic conditions produce multiple rows;
      comorbidity_count aggregates across conditions per patient.

      Grain: one row per (patient_id, condition_flag).
      A patient with diabetes AND hypertension = 2 rows.

    columns:
      - name: patient_id
        description: FHIR Patient resource id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_patients')
                field: patient_id

      - name: condition_flag
        description: Chronic condition classification from silver_conditions.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [diabetes_t2, hypertension, heart_failure, copd]

      - name: first_onset_date
        description: Earliest recorded onset for this patient-condition pair.
        tests:
          - not_null

      - name: latest_onset_date
        description: Latest recorded onset date across all Silver rows for this pair.

      - name: diagnosis_row_count
        description: |
          Number of Silver condition rows collapsed into this pair. Diabetes T2
          typically has 2-3 rows per patient (base diagnosis + complications
          like retinopathy or nephropathy, all sharing the diabetes_t2 flag).
        tests:
          - not_null

      - name: gender
        description: Patient gender from silver_patients (FHIR-native male/female).

      - name: age_years_current
        description: |
          Non-deterministic — recomputes daily. Use for cohort filters, not
          time-based analysis. For time-based analysis use age_at_first_diagnosis.

      - name: age_group
        description: Age bucket from silver_patients.
        tests:
          - not_null

      - name: is_deceased
        description: True if the patient has a deceased_date.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

      - name: age_at_first_diagnosis
        description: Patient age at first_onset_date. Deterministic.

      - name: years_since_first_diagnosis
        description: |
          Years from first_onset_date to deceased_date (or current_timestamp
          if living). Used for chronic disease duration analysis.

      - name: comorbidity_count
        description: |
          Number of distinct chronic condition flags this patient carries.
          Range 1-4. A patient with diabetes only = 1; diabetes + HTN + CHF = 3.
        tests:
          - not_null

      - name: has_comorbidities
        description: True if comorbidity_count >= 2.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: gold_medication_adherence
    description: |
      Medication adherence via approximated PDC (Proportion of Days Covered).
      One row per (patient_id, drug_class).

      Grain: patient + drug_class. A patient on metformin AND a statin has 2 rows.

      Only chronic-condition drug classes (medication_flag IS NOT NULL) are
      included. Non-chronic drugs (antibiotics, painkillers) have completion,
      not adherence.

      DD-002 pivot: Synthea observation values are not clinically realistic,
      so clinical-outcome adherence is meaningless on this data. PDC is the
      industry-standard fallback. See DD-002 for full rationale.

      DD-004: Synthea emits MedicationRequest (prescriptions) but not
      MedicationDispense (pharmacy fills). PDC underestimates real-world
      adherence by 30-50% as a result. Persistence is the operative signal.

      Supply is APPROXIMATED — assumed days_supply is class-level (90d for
      chronic oral maintenance, 30d for inhalers, insulin, anticoagulants,
      opioids) based on published real-world dispensing patterns.

    columns:
      - name: patient_id
        description: FHIR Patient resource id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_patients')
                field: patient_id

      - name: drug_class
        description: Therapeutic classification from silver_medications.drug_class.
        tests:
          - not_null

      - name: medication_flag
        description: Chronic condition category (diabetes_drug, antihypertensive, heart_failure_drug, copd_drug).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [diabetes_drug, antihypertensive, heart_failure_drug, copd_drug]

      - name: first_prescription
        description: Earliest authored_on for this patient-drug_class pair.
        tests:
          - not_null

      - name: last_prescription
        description: Latest authored_on for this patient-drug_class pair.
        tests:
          - not_null

      - name: prescription_count
        description: Number of MedicationRequest rows for this pair.
        tests:
          - not_null

      - name: assumed_days_supply
        description: |
          Class-level supply assumption. 90 for chronic oral maintenance,
          30 for inhalers, insulin, anticoagulants, opioids, and default.

      - name: lifetime_days_supplied
        description: prescription_count * assumed_days_supply across all fills. Uncapped.

      - name: measurement_period_days
        description: Fixed at 365 per CMS PDC methodology.

      - name: fills_in_window
        description: Number of prescriptions authored within the 365-day PDC window ending at last_prescription.
        tests:
          - not_null

      - name: days_covered
        description: least(raw_days_covered, 365). Numerator of PDC.

      - name: pdc
        description: |
          Proportion of Days Covered over CMS 365-day window ending at
          last_prescription. Range 0.0 to 1.0.

      - name: lifetime_period_days
        description: |
          Days from first_prescription to observation_end. Full-history reference
          only; not used for PDC computation.

      - name: lifetime_coverage_ratio
        description: |
          Lifetime coverage. Reference metric — captures long-run persistence but
          is not CMS PDC. See DD-004 for the distinction. NULL for zero-window
          patients.

      - name: persistence_days
        description: |
          Days from first to last prescription. Different from days_covered —
          measures continuity of prescribing, not coverage density. Per DD-004
          this is the operative adherence signal on Synthea data.

      - name: adherence_class
        description: |
          CMS-aligned bucket: adherent (PDC >= 0.80), partial (0.50-0.80),
          non_adherent (< 0.50), single_fill (prescription_count = 1).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [adherent, partial, non_adherent, single_fill]

  - name: gold_utilization
    description: |
      Per-patient utilization metrics. One row per patient (LEFT JOIN preserves
      patients with zero encounters). Counts encounters by type, sums inpatient
      days, and tracks first/last encounter dates.

      Cost is not modeled — Synthea's cost data is fabricated at fixed CPT
      rates and doesn't reflect real payer contracts. Length of stay and
      duration serve as utilization proxies.

      Grain: patient_id (unique).

    columns:
      - name: patient_id
        description: FHIR Patient resource id.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('silver_patients')
                field: patient_id

      - name: total_encounters
        description: Total encounters of any type. Zero for patients with no encounter history.
        tests:
          - not_null

      - name: ambulatory_encounters
        description: Outpatient/clinic visits (FHIR class AMB).
        tests:
          - not_null

      - name: emergency_encounters
        description: ED visits (FHIR class EMER).
        tests:
          - not_null

      - name: inpatient_encounters
        description: Hospital admissions (FHIR class IMP).
        tests:
          - not_null

      - name: home_health_encounters
        description: Home health visits (FHIR class HH).
        tests:
          - not_null

      - name: virtual_encounters
        description: Telehealth (FHIR class VR).
        tests:
          - not_null

      - name: total_inpatient_days
        description: Sum of length_of_stay_days across inpatient encounters. Zero if none.
        tests:
          - not_null

      - name: avg_encounter_duration_minutes
        description: Mean encounter duration. NULL for patients with no encounters.

      - name: first_encounter_date
        description: Earliest start_time across all encounters. NULL for patients with none.

      - name: last_encounter_date
        description: Latest start_time across all encounters. NULL for patients with none.

      - name: active_days
        description: Days from first_encounter_date to last_encounter_date. Zero for zero-encounter patients.
        tests:
          - not_null

      - name: has_no_encounters
        description: True if the patient has zero encounter records.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: gold_provider_volume
    description: |
      Per-provider volume metrics. One row per provider that appears in
      silver_encounters. Tracks total encounters, unique patients served,
      encounter mix by type, inpatient days, and most common clinical
      category treated.

      top_clinical_category uses is_billable_diagnosis filter (DD-001) to
      skip Synthea's non-clinical findings when ranking condition
      categories per provider.

      Grain: provider_id (unique).

    columns:
      - name: provider_id
        description: FHIR Practitioner resource id.
        tests:
          - not_null
          - unique

      - name: total_encounters
        description: All encounters attributed to this provider.
        tests:
          - not_null

      - name: unique_patients
        description: Distinct patients seen by this provider.
        tests:
          - not_null

      - name: avg_encounters_per_patient
        description: total_encounters / unique_patients. Panel loyalty proxy.
        tests:
          - not_null

      - name: ambulatory_encounters
        description: Outpatient volume.
        tests:
          - not_null

      - name: emergency_encounters
        description: ED volume.
        tests:
          - not_null

      - name: inpatient_encounters
        description: Admissions volume.
        tests:
          - not_null

      - name: home_health_encounters
        description: Home health volume.
        tests:
          - not_null

      - name: virtual_encounters
        description: Telehealth volume.
        tests:
          - not_null

      - name: total_inpatient_days
        description: Cumulative length of stay across all admissions. Zero if none.
        tests:
          - not_null

      - name: avg_encounter_duration_minutes
        description: Mean encounter duration across this provider's encounters.

      - name: first_encounter_date
        description: Earliest recorded encounter for this provider.
        tests:
          - not_null

      - name: last_encounter_date
        description: Latest recorded encounter for this provider.
        tests:
          - not_null

      - name: active_days
        description: Days from first_encounter_date to last_encounter_date.
        tests:
          - not_null

      - name: top_clinical_category
        description: |
          Most common clinical_category (from silver_conditions) diagnosed by
          this provider. NULL for providers whose encounters had no billable
          diagnoses recorded. Ties broken alphabetically.